      await this.db.collection('chats').doc(path).set({ members: path.split('_'), last: msg.text.slice(0, 80), lastAt: this.TS(), lastBy: msg.uid }, { merge: true });
    }
  },
  watchChats(uid, cb) {
    return this.db.collection('chats').where('members', 'array-contains', uid).onSnapshot(q => {
      const list = q.docs.map(d => { const x = d.data(); return { id: d.id, members: x.members, last: x.last, lastBy: x.lastBy, at: tsMs(x.lastAt) }; });
      list.sort((a, b) => b.at - a.at);
      cb(list);
    }, e => { console.error(e); cb([]); });
  }
};

/* ---------- Тестовая заглушка (?fake=1): всё хранится в localStorage, вкладки видят друг друга ---------- */
const FakeNet = {
  name: 'fake', ok: true, user: null, watchers: [],
  db() { return lsGet('fakeNet', { users: {}, games: {}, msgs: {}, chats: {} }); },
  put(d) { lsSet('fakeNet', d); this.notify(); },
  notify() { for (const w of this.watchers.slice()) w.run(); },
  async init() {
    window.addEventListener('storage', e => { if (e.key === 'fakeNet') this.notify(); });
    return true;
  },
  onAuth(cb) {
    this.authCb = cb;
    let uid = null; try { uid = sessionStorage.getItem('fakeUid'); } catch (e) { /* ignore */ }
    const d = this.db();
    const u = uid && Object.values(d.users).find(x => x.uid === uid);
    this.user = u ? { uid: u.uid, login: u.login } : null;
    setTimeout(() => cb(this.user, false), 30);
  },
  setUser(u) { this.user = u; try { if (u) sessionStorage.setItem('fakeUid', u.uid); else sessionStorage.removeItem('fakeUid'); } catch (e) { /* ignore */ } if (this.authCb) this.authCb(u, false); },
  async signUp(login, pass, nick) {
    const d = this.db();
    if (d.users[login]) { const e = new Error('x'); e.code = 'auth/email-already-in-use'; throw e; }
    const uid = 'u' + Array.from(login).map(ch => ch.charCodeAt(0).toString(36)).join('');
    d.users[login] = { uid, login, pass, nick: nick || login, avatar: '' };
    this.put(d);
    const u = { uid, login }; this.setUser(u); return u;
  },
  async signIn(login, pass) {
    const d = this.db(), x = d.users[login];
    if (!x || x.pass !== pass) { const e = new Error('x'); e.code = 'auth/invalid-credential'; throw e; }
    const u = { uid: x.uid, login }; this.setUser(u); return u;
  },
  async signOut() { this.setUser(null); },
  async getProfile(uid) { const x = Object.values(this.db().users).find(u => u.uid === uid); return x ? { uid, login: x.login, nick: x.nick, avatar: x.avatar } : null; },
  async saveProfile(uid, patch) { const d = this.db(); const x = Object.values(d.users).find(u => u.uid === uid); Object.assign(x, patch); this.put(d); },
  async searchUsers(p) { return Object.values(this.db().users).filter(u => u.login.startsWith(p.toLowerCase())).slice(0, 12).map(u => ({ uid: u.uid, login: u.login, nick: u.nick, avatar: u.avatar })); },
  async createGame(g) { const d = this.db(); d.games[g.code] = { ...g, updatedAt: Date.now() }; this.put(d); },
  async gameExists(code) { return !!this.db().games[code]; },
  async getGame(code) { const g = this.db().games[code]; return g ? { id: code, ...g } : null; },
  async joinGame(code, uid, info) {
    const d = this.db(), g = d.games[code];
    if (!g) throw new Error('nogame');
    if (g.players.includes(uid)) return { id: code, ...g };
    if (g.status !== 'open' || g.players.length >= 2) throw new Error('full');
    const other = g.hostColor === 'w' ? 'b' : 'w';
    g.names = { ...g.names, [other]: info }; g.players = [...g.players, uid]; g.status = 'playing'; g.updatedAt = Date.now();
    this.put(d); return { id: code, ...g };
  },
  addWatcher(run) { const w = { run }; this.watchers.push(w); run(); return () => { this.watchers = this.watchers.filter(x => x !== w); }; },
  watchGame(code, cb) { let last = ''; return this.addWatcher(() => { const g = this.db().games[code]; const j = JSON.stringify(g || null); if (j === last) return; last = j; cb(g ? { id: code, ...g } : null); }); },
  async saveGame(code, patch) { const d = this.db(); Object.assign(d.games[code], patch, { updatedAt: Date.now() }); this.put(d); },
  watchMyGames(uid, cb) {
    let last = '';
    return this.addWatcher(() => {
      const list = Object.values(this.db().games).filter(g => g.players.includes(uid)).map(x => ({ id: x.code, code: x.code, status: x.status, names: x.names, players: x.players, turn: x.turn, over: x.over, at: x.updatedAt })).sort((a, b) => b.at - a.at);
      const j = JSON.stringify(list); if (j === last) return; last = j; cb(list);
    });
  },
  watchMessages(path, cb) { let last = ''; return this.addWatcher(() => { const m = this.db().msgs[path] || []; const j = JSON.stringify(m); if (j === last) return; last = j; cb(m.slice(-100)); }); },
  async sendMessage(path, msg) {
    const d = this.db();
    (d.msgs[path] = d.msgs[path] || []).push({ id: String(Date.now()) + Math.random(), uid: msg.uid, nick: msg.nick, text: msg.text, at: Date.now() });
    if (path !== 'global' && !path.startsWith('game:')) d.chats[path] = { id: path, members: path.split('_'), last: msg.text, lastBy: msg.uid, at: Date.now() };
    this.put(d);
  },
  watchChats(uid, cb) { let last = ''; return this.addWatcher(() => { const list = Object.values(this.db().chats).filter(c => c.members.includes(uid)).sort((a, b) => b.at - a.at); const j = JSON.stringify(list); if (j === last) return; last = j; cb(list); }); }
};

const Net = /[?&]fake(=|&|$)/.test(location.search) ? FakeNet : RealNet;

function netErrorText(e) {
  const c = (e && e.code) || '';
  if (c === 'auth/email-already-in-use') return 'Такой логин уже занят';
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-login-credentials') return 'Неверный логин или пароль';
  if (c === 'auth/weak-password') return 'Пароль слишком короткий (минимум 6 символов)';
  if (c === 'auth/operation-not-allowed') return 'В Firebase не включён вход по Email/Password';
  if (c === 'auth/network-request-failed' || c === 'unavailable') return 'Нет связи с сервером. В предпросмотре на claude.ai онлайн не работает, откройте установленную версию.';
  if (c === 'auth/too-many-requests') return 'Слишком много попыток, подождите немного';
  if (c === 'permission-denied') return 'Сервер отказал в доступе. Проверьте правила Firestore';
  if (e && e.message === 'nogame') return 'Партия с таким кодом не найдена';
  if (e && e.message === 'full') return 'В этой партии уже двое игроков';
  return 'Что-то пошло не так' + (c ? ' (' + c + ')' : '');
}

/* ---------- шторки ---------- */
function sheet(content, opts) {
  opts = opts || {};
  const sc = h('div.scrim' + (opts.center ? '.center-modal' : ''));
  const sh = h('div.sheet', opts.center ? null : h('div.grab'), content);
  sc.append(sh);
  const close = () => { sc.remove(); if (opts.onClose) opts.onClose(); };
  const soft = () => {
    if (!sc.isConnected) return;
    sh.style.transition = 'transform .22s ease-in'; sc.style.transition = 'opacity .22s';
    sh.style.transform = opts.center ? 'scale(.92)' : 'translateY(105%)'; sc.style.opacity = '0';
    setTimeout(close, 210);
  };
  sc.addEventListener('pointerdown', e => { if (e.target === sc && !opts.sticky) soft(); });
  if (!opts.sticky && !opts.center) {
    /* закрытие свайпом вниз */
    let y0 = 0, t0 = 0, dy = 0, on = false, armed = false;
    const start = (y, t) => { y0 = y; t0 = Date.now(); dy = 0; on = false; armed = sh.scrollTop <= 0 || !!t.closest('.grab'); };
    const move = (y, ev) => {
      if (!armed) return;
      dy = y - y0;
      if (dy > 0 && sh.scrollTop <= 0) {
        on = true;
        if (ev.cancelable) ev.preventDefault();
        sh.style.animation = 'none'; sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`;
        sc.style.background = `rgba(15,10,25,${Math.max(0.05, 0.45 - dy / 700)})`;
      } else if (on) { on = false; sh.style.transform = ''; }
    };
    const end = () => {
      if (!on) return;
      on = false;
      const fast = dy / Math.max(1, Date.now() - t0) > 0.6;
      if (dy > 110 || fast) { sh.style.transition = 'transform .2s ease-out'; sh.style.transform = 'translateY(105%)'; sc.style.transition = 'opacity .2s'; sc.style.opacity = '0'; setTimeout(close, 190); }
      else { sh.style.transition = 'transform .25s cubic-bezier(.2,.9,.3,1.2)'; sh.style.transform = ''; sc.style.background = ''; }
    };
    sh.addEventListener('touchstart', e => start(e.touches[0].clientY, e.target), { passive: true });
    sh.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });
    sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
    const grab = sh.querySelector('.grab');
    if (grab) grab.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch') return;
      start(e.clientY, grab); armed = true;
      const mv = ev => move(ev.clientY, ev), up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); end(); };
      window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
    });
  }
  document.body.append(sc);
  return close;
}
function confirmSheet(title, text, okLabel, cb, danger) {

function authSheet(onDone) {

  const box = h('div');

    box.replaceChildren();
    const login = h('input#a-login', { type: 'text', autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false', maxlength: '16', placeholder: 'например, knight_42' });
    const pass = h('input#a-pass', { type: 'password', autocomplete: reg ? 'new-password' : 'current-password', placeholder: 'минимум 6 символов' });
    const nick = h('input#a-nick', { type: 'text', maxlength: '20', value: me.nick === 'Игрок' ? '' : me.nick, placeholder: 'как вас видят другие' });
    const err = h('div.err');
    const go = async () => {
      if (busy) return;
      const l = login.value.trim().toLowerCase(), p = pass.value;
      if (!LOGIN_RE.test(l)) { err.textContent = 'Логин: 3–16 знаков, латинские буквы, цифры, _ или точка'; return; }
      if (p.length < 6) { err.textContent = 'Пароль: минимум 6 символов'; return; }
      busy = true; btn.disabled = true; err.textContent = '';
      try {
        if (reg) {
          const nk = nick.value.trim().slice(0, 20) || (me.nick !== 'Игрок' ? me.nick : l);
          await Net.signUp(l, p, nk);
          me.nick = nk; saveLocalProf();
          if (me.avatar) { try { await Net.saveProfile(Net.user.uid, { avatar: me.avatar }); } catch (e) { /* ignore */ } }
        } else await Net.signIn(l, p);
        close(); toast(reg ? 'Аккаунт создан' : 'Вы вошли');
        if (onDone) setTimeout(onDone, 350);
      } catch (e) { err.textContent = netErrorText(e); busy = false; btn.disabled = false; }
    };
    const btn = h('button.btn.block', { onclick: go }, reg ? 'Создать аккаунт' : 'Войти');
    [login, pass, nick].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
    box.append(
      h('h3', reg ? 'Новый аккаунт' : 'Вход'),
      h('p.muted.small', { style: 'margin:0 0 14px' }, 'Аккаунт нужен для игры по сети и чатов. Почта не требуется.'),
      h('div.field', h('label', { for: 'a-login' }, 'Логин'), login),

  };
  draw();

}

function bindDrag(el, c) {

  };
  el.addEventListener('pointerdown', e => {
    if (e.button > 0 || !G) return;
    st = { id: e.pointerId, x0: e.clientX, y0: e.clientY, drag: false, held: false };
    st.timer = setTimeout(() => { if (st && !st.drag) { st.held = true; dragEnd = Date.now(); cardInfoSheet(c); } }, 520);
    try { el.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
  });

      const r0 = el.getBoundingClientRect();

      gh.classList.add('dragghost');

    if (st.drag) {
      st.ghost.style.transform = `translate(${e.clientX - st.w / 2}px, ${e.clientY - st.h * 0.7}px) rotate(${Math.max(-12, Math.min(12, (e.clientX - st.x0) / 14))}deg) scale(1.05)`;
      const over = dropZoneHit(e.clientX, e.clientY);

    }

    const tb = document.querySelector('.tbl2'); if (tb) tb.classList.remove('over');
    const gh = s0.ghost, rect = gh.getBoundingClientRect();

      const an = gh.animate([{ transform: gh.style.transform }, { transform: gh.style.transform + ` translate(${dx}px,${dy}px)` }], { duration: 200, easing: 'ease-out', fill: 'forwards' });

}

}

let unsubG = null, unsubC = null;
function onAuthChange(u) {
  if (unsubG) { unsubG(); unsubG = null; } if (unsubC) { unsubC(); unsubC = null; }
  myGames = []; myChats = [];
  if (!u) { me.uid = null; me.login = null; render(); return; }
  me.uid = u.uid; me.login = u.login;
  Net.getProfile(u.uid).then(p => {
    if (p) {
      if (p.nick) me.nick = p.nick;
      if (p.avatar) me.avatar = p.avatar; else if (me.avatar) Net.saveProfile(u.uid, { avatar: me.avatar }).catch(() => { });
      saveLocalProf();
    } else Net.saveProfile(u.uid, { nick: me.nick, avatar: me.avatar || '' }, u.login).catch(() => { });
    refreshTab();
  }).catch(() => { });
  unsubG = Net.watchMyGames(u.uid, l => { myGames = l; refreshTab(); });
  unsubC = Net.watchChats(u.uid, l => { myChats = l; refreshTab(); });
  render();
}

  applyTheme();

  if (cur().name === 'tabs') refreshTab();
}

  const r = t.getBoundingClientRect(), d = Math.max(r.width, r.height) * 1.6;
  const w = h('span.rip', { style: `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px` });
  t.append(w); setTimeout(() => w.remove(), 600);
}, { passive: true });
boot();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
}
